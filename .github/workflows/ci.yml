name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install ruff

      - name: Refuse tracked secrets, databases and environments
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(?!example$)|\.(db|sqlite3?|pem|key|p12|pfx)$|(^|/)(\.?venv|node_modules)/' -P || true)
          if [ -n "$bad" ]; then echo "Forbidden files are tracked:"; echo "$bad"; exit 1; fi

      - name: Lint
        run: ruff check .

      - name: Configuration loads with placeholder settings
        env:
          AGENCY_STRIPE_API_KEY: sk_test_ci
          AGENCY_STRIPE_WEBHOOK_SECRET: whsec_ci
        run: python -c "from api.main import app; print(app.title, sorted(app.openapi()['paths']))"

      - name: Tests
        run: pytest -q
